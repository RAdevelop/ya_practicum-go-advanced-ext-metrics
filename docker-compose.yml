services:
  postgres:
    image: postgres:17.11-bookworm
    container_name: postgres
    hostname: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./env_build/db_init_scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - go-advanced-ext

volumes:
  postgres_data:
  postgres_data_test:

networks:
  go-advanced-ext:
    driver: bridge