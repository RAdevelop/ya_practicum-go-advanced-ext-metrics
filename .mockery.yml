all: false
dir: '{{.InterfaceDir}}'
filename: mocks_mockery.go
force-file-write: true
formatter: goimports
formatter-options:
  goimports:
    all-errors: false
    comments: true
    format-only: true
    fragment: false
    local-prefix: ""
    tab-indent: true
    tab-width: 8
generate: true
include-auto-generated: false
log-level: info
structname: '{{.Mock}}{{.InterfaceName}}'
pkgname: '{{.SrcPackageName}}'
recursive: false
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
  github.com/RAdevelop/ya_practicum-go-advanced-ext-metrics/internal/service/metric:
    config:
      all: false
    interfaces:
      Storage:
  github.com/RAdevelop/ya_practicum-go-advanced-ext-metrics/internal/config/server:
    config:
      all: false
    interfaces:
      ConfigProvider:
  github.com/RAdevelop/ya_practicum-go-advanced-ext-metrics/internal/service/snapshot:
    config:
      all: false
    interfaces:
      Able:
  github.com/RAdevelop/ya_practicum-go-advanced-ext-metrics/internal/logger:
    config:
      all: false
    interfaces:
      Logger:

